<nav class="navbar custom-navbar">

  <div class="container navbar-content">

    <a
      class="navbar-brand"
      routerLink="/movies">
      <span class="brand-icon">🎬</span>
      <span>Bioskop</span>
    </a>


    @if (isLoggedIn()) {

      <div class="main-navigation">

        <a
          class="nav-link"
          routerLink="/movies"
          routerLinkActive="active">
          Filmovi
        </a>

        <a
          class="nav-link"
          routerLink="/screenings"
          routerLinkActive="active">
          Projekcije
        </a>

        <a
          class="nav-link"
          routerLink="/reservations"
          routerLinkActive="active">
          Rezervacije
        </a>


        @if (isAdmin()) {

          <span class="nav-divider"></span>

          <a
            class="nav-link admin-link"
            routerLink="/movies/new"
            routerLinkActive="active">
            + Film
          </a>

          <a
            class="nav-link admin-link"
            routerLink="/screenings/new"
            routerLinkActive="active">
            + Projekcija
          </a>

        }

      </div>

    }


    <div class="account-navigation">

      @if (!isLoggedIn()) {

        <a
          class="btn btn-outline-light"
          routerLink="/login">
          Prijava
        </a>

      } @else {

        @if (isAdmin()) {

          <span class="admin-badge">
            ADMIN
          </span>

        }

        <button
          type="button"
          class="btn logout-button"
          (click)="logout()">
          Odjava
        </button>

      }

    </div>

  </div>

</nav>

<router-outlet></router-outlet>
